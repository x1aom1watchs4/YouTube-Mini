name: App builds

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build-vela:
    name: Build watch app (RPK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Lint Vela sources
        run: npm run lint
      - name: Build RPK
        run: npm run build
      - name: Upload RPK output
        uses: actions/upload-artifact@v4
        with:
          name: youtube-mini-vela-rpk
          path: |
            dist/**/*.rpk
            build/**/*.rpk
          if-no-files-found: error

  build-android:
    name: Build phone app (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get official Xiaomi XMS Wearable SDK
        uses: actions/checkout@v4
        with:
          repository: open-vela/packages_apps
          ref: dev
          path: open-vela-sdk
          sparse-checkout: wearable/interconnect_image_demo/android_program/libs/xms-wearable-lib_1.4_release.aar
          sparse-checkout-cone-mode: false
      - name: Install SDK library
        run: |
          mkdir -p phone/app/libs
          cp open-vela-sdk/wearable/interconnect_image_demo/android_program/libs/xms-wearable-lib_1.4_release.aar phone/app/libs/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Assemble debug APK
        run: gradle -p phone assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: youtube-mini-android-apk
          path: phone/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

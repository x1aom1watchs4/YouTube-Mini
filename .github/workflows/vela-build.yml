name: App builds

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-vela:
    name: Build watch app (RPK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Lint Vela sources
        run: npm run lint
      - name: Build debug RPK
        run: npm run build
      - name: Verify and stage debug RPK
        run: |
          set -euo pipefail
          RPK="$(find dist -type f -name '*.debug.*.rpk' -print -quit)"
          test -n "$RPK"
          mkdir -p artifacts
          cp "$RPK" artifacts/
          file src/common/icon.png
          node -e "const b=require('fs').readFileSync('src/common/icon.png'); if(b.toString('hex',0,8)!=='89504e470d0a1a0a'||b.readUInt32BE(16)!==192||b.readUInt32BE(20)!==192) process.exit(1); console.log('Icon verified: PNG 192x192')"
      - name: Upload debug RPK
        uses: actions/upload-artifact@v4
        with:
          name: youtube-mini-vela-debug-rpk
          path: artifacts/*.rpk
          if-no-files-found: error
      - name: Configure Vela release signing certificate
        id: signing
        env:
          VELA_PRIVATE_KEY: ${{ secrets.VELA_PRIVATE_KEY }}
          VELA_CERTIFICATE: ${{ secrets.VELA_CERTIFICATE }}
        run: |
          set -euo pipefail
          if [ -z "$VELA_PRIVATE_KEY" ] || [ -z "$VELA_CERTIFICATE" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Release signing secrets are not configured; debug RPK is still available."
            exit 0
          fi
          mkdir -p sign
          printf '%s\n' "$VELA_PRIVATE_KEY" > sign/private.pem
          printf '%s\n' "$VELA_CERTIFICATE" > sign/certificate.pem
          openssl pkey -in sign/private.pem -check -noout
          openssl x509 -in sign/certificate.pem -noout -subject -dates
          KEY_HASH="$(openssl pkey -in sign/private.pem -pubout -outform DER | sha256sum | cut -d' ' -f1)"
          CERT_HASH="$(openssl x509 -in sign/certificate.pem -pubkey -noout | openssl pkey -pubin -outform DER | sha256sum | cut -d' ' -f1)"
          test "$KEY_HASH" = "$CERT_HASH"
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Build signed release RPK
        if: steps.signing.outputs.ready == 'true'
        run: npm run release
      - name: Verify and stage release RPK
        if: steps.signing.outputs.ready == 'true'
        run: |
          set -euo pipefail
          RPK="$(find dist -type f -name '*.release.*.rpk' -print -quit)"
          test -n "$RPK"
          mkdir -p release-artifacts
          cp "$RPK" release-artifacts/
      - name: Upload signed release RPK
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: youtube-mini-vela-release-rpk
          path: release-artifacts/*.rpk
          if-no-files-found: error

  build-android:
    name: Build phone app (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get official Xiaomi XMS Wearable SDK
        uses: actions/checkout@v4
        with:
          repository: open-vela/packages_apps
          ref: dev
          path: open-vela-sdk
          sparse-checkout: wearable/interconnect_image_demo/android_program/libs/xms-wearable-lib_1.4_release.aar
          sparse-checkout-cone-mode: false
      - name: Install SDK library
        run: |
          mkdir -p phone/app/libs
          cp open-vela-sdk/wearable/interconnect_image_demo/android_program/libs/xms-wearable-lib_1.4_release.aar phone/app/libs/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Prepare Android release signing
        id: android-signing
        env:
          VELA_PRIVATE_KEY: ${{ secrets.VELA_PRIVATE_KEY }}
          VELA_CERTIFICATE: ${{ secrets.VELA_CERTIFICATE }}
        run: |
          set -euo pipefail
          if [ -z "$VELA_PRIVATE_KEY" ] || [ -z "$VELA_CERTIFICATE" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Android release signing secrets are not configured; debug APK is still available."
            exit 0
          fi
          mkdir -p phone/signing
          printf '%s\n' "$VELA_PRIVATE_KEY" > phone/signing/private.pem
          printf '%s\n' "$VELA_CERTIFICATE" > phone/signing/certificate.pem
          openssl pkey -in phone/signing/private.pem -check -noout
          KEY_HASH="$(openssl pkey -in phone/signing/private.pem -pubout -outform DER | sha256sum | cut -d' ' -f1)"
          CERT_HASH="$(openssl x509 -in phone/signing/certificate.pem -pubkey -noout | openssl pkey -pubin -outform DER | sha256sum | cut -d' ' -f1)"
          test "$KEY_HASH" = "$CERT_HASH"
          KEYSTORE_PASSWORD="$(openssl rand -hex 32)"
          openssl pkcs12 -export -in phone/signing/certificate.pem -inkey phone/signing/private.pem -out "$RUNNER_TEMP/youtube-mini-release.p12" -name youtube-mini -passout "pass:$KEYSTORE_PASSWORD"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/youtube-mini-release.p12" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Assemble debug APK
        run: gradle -p phone assembleDebug
      - name: Assemble signed release APK
        if: steps.android-signing.outputs.ready == 'true'
        run: gradle -p phone assembleRelease
      - name: Verify Android APK certificate matches Vela certificate
        if: steps.android-signing.outputs.ready == 'true'
        run: |
          set -euo pipefail
          APK="$(find phone/app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          APK_HASH="$("$APKSIGNER" verify --print-certs "$APK" | awk -F': ' '/certificate SHA-256 digest/ {print tolower($2); exit}' | tr -d ':')"
          CERT_HASH="$(openssl x509 -in phone/signing/certificate.pem -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test -n "$APK_HASH"
          test "$APK_HASH" = "$CERT_HASH"
          mkdir -p phone/release-artifacts
          cp "$APK" phone/release-artifacts/
          echo "Verified: Android APK certificate SHA-256 matches the Vela release certificate."
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: youtube-mini-android-debug-apk
          path: phone/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload signed release APK
        if: steps.android-signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: youtube-mini-android-release-apk
          path: phone/release-artifacts/*.apk
          if-no-files-found: error

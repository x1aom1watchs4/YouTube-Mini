name: Vela app check

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Lint Vela sources
        run: npm run lint
      - name: Build RPK
        run: npm run build
      - name: Upload RPK output
        uses: actions/upload-artifact@v4
        with:
          name: youtube-mini-vela-rpk
          path: |
            dist/**/*.rpk
            build/**/*.rpk
          if-no-files-found: warn
